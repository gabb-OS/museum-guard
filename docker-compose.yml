version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: museumguard-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb/init:/docker-entrypoint-initdb.d
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: museumguard-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
    depends_on:
      - influxdb
    restart: unless-stopped

  mashup-app:
    build: ./mashup-app
    container_name: museumguard-mashup
    volumes:
      - ./mashup-app/src:/app/src
    environment:
      - WOT_CONTROLLER_URL=http://node-wot:8080
      - TELEMETRY_POLL_MS=${TELEMETRY_POLL_MS:-5000}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    depends_on:
      - node-wot
      - influxdb
    restart: unless-stopped
    
  node-wot:
    build: ./wot-controller
    container_name: museumguard-wot
    ports:
      - "8080:8080"
    volumes:
      - ./wot-controller/src:/app/src
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      # Con USE_MOCKS=true (vedi .env) questi puntano ai container mock,
      # con USE_MOCKS=false li imposti agli IP reali dell'ESP32 sulla LAN.
      - ESP_SEN_ADDRESS=${ESP_SEN_ADDRESS}
      - ESP_ACT_ADDRESS=${ESP_ACT_ADDRESS}
      - COAP_PORT=${COAP_PORT}
      - HTTP_PORT=${HTTP_PORT}
    depends_on:
      - influxdb
    restart: unless-stopped

  # --- Mock: partono SOLO con `docker compose --profile mock up` ---
  # Utili quando lavori senza hardware fisico collegato (es. i due PC
  # separati: uno fa girare i mock, l'altro il solo node-wot puntato
  # sull'ESP reale).
  esp-sen-mock:
    # "mock" = alias comodo per "tutti i mock insieme"; "mock-sen" = solo questo
    profiles: ["mock", "mock-sen"]
    build: ./esp/esp-sen/mockup
    container_name: museumguard-sen-mock
    # ports:
    #   - "5683:5683/udp"   # scommenta solo per test manuali dall'host
    restart: unless-stopped

  esp-act-mock:
    profiles: ["mock", "mock-act"]
    build: ./esp/esp-act/mockup
    container_name: museumguard-act-mock
    ports:
      - "8081:80"   # per test manuale dall'host (opzionale)
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: museumguard-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb/init:/docker-entrypoint-initdb.d
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=myorg
      - DOCKER_INFLUXDB_INIT_BUCKET=museum_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-token
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: museumguard-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb
    restart: unless-stopped

  node-wot:
    build: ./node-wot
    container_name: museumguard-wot
    ports:
      - "8080:8080"
    volumes:
      - ./node-wot/src:/app/src
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-super-token
      - INFLUXDB_ORG=myorg
      - INFLUXDB_BUCKET=museum_data
      # I mock ora si chiamano esp-sen-mock e esp-act-mock
      - ESP_SEN_ADDRESS=esp-sen-mock
      - ESP_ACT_ADDRESS=esp-act-mock
      - COAP_PORT=5683
      - HTTP_PORT=80
    depends_on:
      - influxdb
    restart: unless-stopped

  esp-sen-mock:
    build: ./esp/esp-sen/mock
    container_name: museumguard-sen-mock
    # Espone solo all'interno della rete Docker; se vuoi testare CoAP dall'host devi mappare la porta UDP
    # ports:
    #   - "5683:5683/udp"
    environment:
      - WOT_CONTROLLER_HOST=node-wot
    depends_on:
      - node-wot
    restart: unless-stopped

  esp-act-mock:
    build: ./esp/esp-act/mock
    container_name: museumguard-act-mock
    ports:
      - "8081:80"   # per test manuale dall'host (opzionale)
    environment:
      - WOT_CONTROLLER_HOST=node-wot
    depends_on:
      - node-wot
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
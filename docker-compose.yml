services:
  influxdb:
    image: influxdb:2.7
    container_name: museumguard-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb/init:/docker-entrypoint-initdb.d
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: museumguard-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - GF_INSTALL_PLUGINS=volkovlabs-form-panel
      - GF_LOG_LEVEL=warn      # <-- aggiunta: solo warning/error, non più info
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning
    depends_on:
      - influxdb
    restart: unless-stopped

  mashup-app:
    build: ./mashup-app
    container_name: museumguard-mashup
    ports:
      - "3001:3001"
    volumes:
      - ./mashup-app/src:/app/src
    environment:
      - WOT_CONTROLLER_URL=http://node-wot:8080
      - TELEMETRY_POLL_MS=${TELEMETRY_POLL_MS:-1000}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_CHAT_ID=${TELEGRAM_BOT_CHAT_ID}
      - PREDICTIVE_LIGHT_URL=http://predictive-light:8000
      - PREDICTIVE_LIGHT_TIMEOUT_MS=${PREDICTIVE_LIGHT_TIMEOUT_MS:-3000}
      - MASHUP_SERVER_API_PORT=${MASHUP_SERVER_API_PORT:-3001}
    depends_on:
      - node-wot
      - influxdb
      - predictive-light
    restart: unless-stopped

  predictive-light:
    build: ./predictive-light
    container_name: museumguard-predictive-light
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - PREDICT_INTERVAL_S=${PREDICT_INTERVAL_S:-60}
      - PREDICTION_HORIZON_S=${PREDICTION_HORIZON_S:-30}
      - HISTORY_WINDOW_S=${HISTORY_WINDOW_S:-600}
      - EMA_ALPHA=${EMA_ALPHA:-0.3}
    depends_on:
      - influxdb
    restart: unless-stopped

  node-wot:
    build: ./wot-controller
    container_name: museumguard-wot
    ports:
      - "8080:8080"
    volumes:
      - ./wot-controller/src:/app/src
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      # With USE_MOCKS=true (see .env) these point to the mock containers,
      # with USE_MOCKS=false you set them to the real IPs of the ESP32 on the LAN.
      - ESP_SEN_ADDRESS=${ESP_SEN_ADDRESS}
      - ESP_ACT_ADDRESS=${ESP_ACT_ADDRESS}
      - COAP_PORT=${COAP_PORT}
      - HTTP_PORT=${HTTP_PORT}
    depends_on:
      - influxdb
    restart: unless-stopped

# --- Mocks: ONLY start with `docker compose --profile mock up` ---
# Useful when you're working without physical hardware connected (e.g., two separate PCs
#: one runs the mocks, the other just runs node-wot pointed
# at the real ESP).
  esp-sen-mock:
    # "mock" = convenient alias for "all mocks together"; "mock-sen" = just this one
    profiles: ["mock", "mock-sen"]
    build: ./esp/esp-sen/mockup
    container_name: museumguard-sen-mock
  # ports:
  # - "5683:5683/udp" # Uncomment only for manual testing from the host
    restart: unless-stopped

  esp-act-mock:
    profiles: ["mock", "mock-act"]
    build: ./esp/esp-act/mockup
    container_name: museumguard-act-mock
    ports:
      - "8081:80" # for manual testing from the host (optional)
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
# grafana/dashboards/dashboard-provider.yaml
#
# this that Grafana automatically loads every .json file found in this
# folder and displays it as a dashboard. The museumguard.json file next to
# this one is collected this way, without having to import it manually from the UI.

apiVersion: 1

providers:
  - name: MuseumGuard
    orgId: 1
    folder: "MuseumGuard"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
# grafana/datasources/datasource.yaml
#
# Automatically provision the InfluxDB datasource. Grafana reads all
# .yaml/.yml files under /etc/grafana/provisioning/datasources/ at boot.
#
# ${INFLUXDB_ORG}, ${INFLUXDB_BUCKET}, ${INFLUXDB_TOKEN} are
# replaced by Grafana with the envs passed to the container (already present
# in the "grafana" service in docker-compose.yml).

apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    uid: influxdb_museumguard   # fixed uid, used in dashboard panels
    access: proxy
    url: http://influxdb:8086   # Docker internal hostname
    isDefault: true
    editable: false             # force editing here instead of from the UI
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}